<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orthogo</title>
<meta name="description" content="Orthogo – a logic puzzle with letters and colours for Android.">
<link rel="icon" href="icon.png">
<style>
  :root{--bg:#232F6E;--card:#fff;--ink:#1A2233;--mut:#5A6478;--a:#2F6FDB}
  @media (prefers-color-scheme:dark){:root{--bg:#121722;--card:#1D2433;--ink:#ECF0F6;--mut:#9AA4B8;--a:#6C9DF2}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box}
  main{background:var(--card);color:var(--ink);border-radius:24px;padding:32px 24px;max-width:440px;width:100%;text-align:center;box-sizing:border-box}
  img{width:112px;height:112px;border-radius:26px}
  h1{margin:12px 0 4px;font-size:2rem} p{margin:.4em 0;color:var(--mut)} a{color:var(--a)}
  nav{margin-top:20px;display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>Orthogo</h1>
  <p>A logic puzzle with letters and colours for Android.</p>
  <nav>
    <a href="privacy.html">Privacy Policy · Polityka prywatności</a>
    <a href="mailto:orthogo.app@gmail.com">orthogo.app@gmail.com</a>
  </nav>
</main>
</body>
</html>
